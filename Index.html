<!DOCTYPE html>
<html>
<head>
  <title>Restricted Content</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      flex-direction: column;
    }

    .warning-box {
      border: 2px solid red;
      padding: 40px;
      max-width: 400px;
      background: #1a1a1a;
      box-shadow: 0 0 20px rgba(255,0,0,0.4);
    }

    h1 {
      color: red;
      margin-bottom: 10px;
    }

    p {
      font-size: 0.95rem;
      opacity: 0.8;
    }

    button {
      margin-top: 25px;
      padding: 12px 25px;
      font-size: 1rem;
      cursor: pointer;
      background: red;
      color: white;
      border: none;
    }

    button:hover {
      background: darkred;
    }

    .small {
      font-size: 0.75rem;
      margin-top: 20px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="warning-box">
    <h1>18+ Content Warning</h1>
    <p>This page contains sensitive material that may not be suitable for minors.</p>
    <p>By proceeding, you confirm that you are at least 18 years old.</p>
    <button onclick="window.location.href='reveal.html'">
      I Understand
    </button>
    <div class="small">
      Viewer discretion advised.
    </div>
  </div>
</body>
</html>
